<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <title>Distant grid and telemetry field</title>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="1" />
    </pattern>
    <radialGradient id="horizon" cx="50%" cy="72%" r="58%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#00ff41" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0a0514" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" />
      <stop offset="45%" stop-color="#fff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.25" />
    </linearGradient>
    <mask id="gridMask">
      <rect width="1600" height="900" fill="url(#gridFade)" />
    </mask>
  </defs>

  <rect width="1600" height="900" fill="url(#horizon)" />
  <g mask="url(#gridMask)">
    <rect width="1600" height="900" fill="url(#grid)" />
  </g>

  <!-- Scattered registration marks, thinning toward the top -->
  <g stroke="#00ff41" stroke-opacity="0.28" stroke-width="1.5">
    <path d="M180 250h16M188 242v16" />
    <path d="M470 180h12M476 174v12" />
    <path d="M880 300h16M888 292v16" />
    <path d="M1240 210h12M1246 204v12" />
    <path d="M1420 380h16M1428 372v16" />
    <path d="M320 560h16M328 552v16" />
    <path d="M1080 620h12M1086 614v12" />
  </g>

  <!-- Concentric scan rings on the horizon -->
  <g stroke="#22d3ee" fill="none">
    <ellipse cx="800" cy="700" rx="240" ry="60" stroke-opacity="0.16" />
    <ellipse cx="800" cy="700" rx="440" ry="110" stroke-opacity="0.11" />
    <ellipse cx="800" cy="700" rx="660" ry="165" stroke-opacity="0.07" />
  </g>

  <g fill="#22d3ee" fill-opacity="0.35">
    <circle cx="250" cy="120" r="2" />
    <circle cx="640" cy="330" r="1.6" />
    <circle cx="1010" cy="150" r="2.2" />
    <circle cx="1330" cy="520" r="1.8" />
    <circle cx="520" cy="640" r="2" />
  </g>
</svg>
